name: WG Schedule Daily Sync

on:
  schedule:
    # 台灣時間 05:10, 11:10, 20:10 (對應 UTC 23:10, 05:10, 14:10)
    - cron: '10 2,12,21 * * *'
  workflow_dispatch: # 支援手動隨時點擊測試

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝依賴套件 (Playwright & Axios)
        run: |
          npm init -y
          npm install playwright axios
          npx playwright install --with-deps chromium

      - name: 執行爬蟲並同步試算表
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node crawler.js
