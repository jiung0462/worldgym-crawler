<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Gym 台南 BodyCombat 週課表</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      overscroll-behavior: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      margin: 10px;
      background-color: #f1f3f5;
      color: #333;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 10px;
    }
    .nav-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:hover { background-color: #b02a37; }

    #week-title {
      font-size: 18px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
    }
    
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: calc(100vh - 85px);
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 800px;
      font-size: 13px;
    }
    th, td {
      border-right: 1px solid #d0d7de;
      border-bottom: 1px solid #d0d7de;
      padding: 5px 4px;
      text-align: center;
      vertical-align: middle;
    }
    table tr th:first-child, table tr td:first-child {
      border-left: 1px solid #d0d7de;
    }
    table tr:first-child th {
      border-top: 1px solid #d0d7de;
    }

    .border-thick-bottom {
      border-bottom: 2px solid #94a3b8 !important;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #f8f9fa;
      font-weight: 700;
      padding: 8px 4px;
      z-index: 10;
      box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
    }
    .th-day-label {
      font-size: 14px;
      color: #475569;
      display: block;
      margin-bottom: 2px;
    }
    .th-date-text {
      display: block;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.2px;
    }

    .time-col {
      font-weight: bold;
      color: #495057;
      width: 60px;
    }

    .slot-morning { background-color: #f8fafc; }
    .slot-afternoon { background-color: #fffaf5; }
    .slot-evening { background-color: #faf5ff; }

    .today-col {
      border-left: 2px solid #2563eb !important;
      border-right: 2px solid #2563eb !important;
    }
    th.today-header {
      background-color: #dbeafe !important;
      color: #1e3a8a;
      border-left: 2px solid #2563eb !important;
      border-right: 2px solid #2563eb !important;
      border-top: 2px solid #2563eb !important;
      border-bottom: 2px solid #2563eb !important;
      z-index: 11;
    }
    th.today-header .th-day-label {
      color: #1d4ed8;
      font-weight: 800;
    }
    th.today-header .th-date-text {
      color: #1e3a8a;
      font-weight: 800;
    }
    td.today-bottom {
      border-bottom: 2px solid #2563eb !important;
    }

    .course-card {
      padding: 4px 6px;
      margin-bottom: 3px;
      border-radius: 5px;
      text-align: left;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      border: 1px solid #cbd5e1;
      border-left-width: 6px;
      border-left-style: solid;
      transition: transform 0.1s ease;
    }
    .course-card:hover {
      transform: translateY(-1px);
    }
    .course-card:last-child { margin-bottom: 0; }

    .card-odd {
      background-color: #ffffff;
    }
    .card-even {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .card-row-top {
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .branch-badge {
      font-weight: 700;
      color: #0f172a;
    }
    .teacher-name {
      font-weight: 700;
      margin-left: 2px;
    }

    .card-row-time {
      color: #334155;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .highlight-card {
      background: #fef08a !important;
      border: 1px solid #eab308 !important;
      border-left: 6px solid #ca8a04 !important;
      box-shadow: 0 2px 6px rgba(202, 138, 4, 0.35) !important;
      color: #713f12 !important;
    }
    .highlight-card .branch-badge {
      color: #713f12 !important;
    }
    .highlight-card .teacher-name {
      color: #854d0e !important;
    }
    .highlight-card .card-row-time {
      color: #854d0e !important;
    }
    .highlight-card .class-name-tag {
      color: #854d0e !important;
      font-weight: 700;
    }

    .class-name-tag {
      display: block;
      font-size: 11px;
      color: #854d0e;
      margin-top: 2px;
      border-top: 1px dashed rgba(0,0,0,0.15);
      padding-top: 2px;
      white-space: nowrap;
    }

    @media screen and (max-width: 768px) {
      body { margin: 6px; }
      .header-bar { padding: 8px 12px; margin-bottom: 8px; }
      #week-title { font-size: 15px !important; }
      .nav-btn { padding: 5px 10px; font-size: 12px; }

      th, td {
        padding: 4px 3px;
      }
      .time-col {
        width: 50px;
        font-size: 11px;
      }

      th {
        padding: 6px 2px;
      }
      .th-day-label {
        font-size: 13px;
        margin-bottom: 1px;
      }
      .th-date-text {
        font-size: 13px;
        font-weight: 800;
      }

      .course-card {
        padding: 3px 4px;
        margin-bottom: 2px;
        border-left-width: 5px;
        border-radius: 4px;
      }

      .branch-badge {
        font-size: 12px;
      }
      .teacher-name {
        font-size: 12px;
      }
      .card-row-time {
        font-size: 11.5px;
        font-weight: 600;
      }

      .class-name-tag {
        font-size: 10px;
        padding-top: 1px;
        margin-top: 1px;
      }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <button class="nav-btn" onclick="shiftWeek(-1)">◀ 上一週</button>
    <div id="week-title">課表載入中...</div>
    <button class="nav-btn" onclick="shiftWeek(1)">下一週 ▶</button>
  </div>

  <div class="table-container">
    <table id="schedule-table">
      <thead>
        <tr id="thead-row">
          <th>時間</th>
          <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th>
          <th>時間</th>
        </tr>
      </thead>
      <tbody id="tbody-rows">
        <tr><td colspan="9" style="padding: 30px; text-align:center;">正在載入課表...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ 請在此填入第一步取得的 GAS 部署網址
    const GAS_API_URL = "https://script.google.com/macros/s/你的部署ID/exec";

    let allCourses = [];
    let currentMonday = getMonday(new Date());

    const HIGHLIGHT_TEACHER = "吳小P";
    const teacherColorMap = new Map();

    function initTeacherColors(courses) {
      teacherColorMap.clear();

      const teacherNames = new Set();
      (courses || []).forEach(c => {
        const cleanName = (c.teacher || '').replace(/\s*\(代課\)/g, '').trim();
        if (cleanName) teacherNames.add(cleanName);
      });

      teacherNames.delete(HIGHLIGHT_TEACHER);
      const sortedTeachers = Array.from(teacherNames).sort();

      sortedTeachers.forEach((name, index) => {
        const hue = Math.round((index * 137.5) % 360);
        const color = `hsl(${hue}, 85%, 35%)`;
        teacherColorMap.set(name, color);
      });
    }

    function getTeacherColor(teacherName) {
      const cleanName = (teacherName || '').replace(/\s*\(代課\)/g, '').trim();
      return teacherColorMap.get(cleanName) || '#334155';
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      date.setHours(0,0,0,0);
      return new Date(date.setDate(diff));
    }

    function toStandardDateStr(dVal) {
      if (!dVal) return "";
      const str = String(dVal);
      const m = str.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) {
        return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
      }
      return "";
    }

    function formatISODate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatShortDate(d) {
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function parseHour(timeVal) {
      if (!timeVal) return -1;
      const match = String(timeVal).match(/(\d{1,2}):(\d{2})/);
      return match ? parseInt(match[1], 10) : -1;
    }

    function cleanTimeStr(timeVal) {
      if (!timeVal) return "";
      const match = String(timeVal).match(/\d{1,2}:\d{2}/);
      return match ? match[0] : String(timeVal).trim();
    }

    function renderTable() {
      const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
      const weekDates = [];
      const todayISO = formatISODate(new Date());

      for (let i = 0; i < 7; i++) {
        let temp = new Date(currentMonday);
        temp.setDate(temp.getDate() + i);
        weekDates.push(temp);
      }

      document.getElementById('week-title').innerText = 
        `${currentMonday.getFullYear()} 年 ${formatShortDate(weekDates[0])} ~ ${formatShortDate(weekDates[6])}`;

      let theadHtml = '<th class="time-col">時間</th>';
      weekDates.forEach((d, idx) => {
        const iso = formatISODate(d);
        const isToday = (iso === todayISO);
        const thClass = isToday ? 'today-header' : '';
        
        theadHtml += `
          <th class="${thClass}">
            <span class="th-day-label">${dayNames[idx]}</span>
            <span class="th-date-text">${formatShortDate(d)}</span>
          </th>`;
      });
      theadHtml += '<th class="time-col">時間</th>';
      document.getElementById('thead-row').innerHTML = theadHtml;

      const timeSlots = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"];

      let tbodyHtml = '';

      for (let r = 0; r < timeSlots.length; r++) {
        const timeLabel = timeSlots[r];
        const slotHour = parseInt(timeLabel.split(':')[0], 10);
        
        let slotClass = '';
        if (slotHour >= 8 && slotHour <= 12) slotClass = 'slot-morning';
        else if (slotHour >= 13 && slotHour <= 17) slotClass = 'slot-afternoon';
        else slotClass = 'slot-evening';

        const isThickBottom = (timeLabel === "12:00" || timeLabel === "17:00");
        const thickClass = isThickBottom ? 'border-thick-bottom' : '';

        tbodyHtml += `<tr><td class="time-col ${slotClass} ${thickClass}">${timeLabel}</td>`;
        
        for (let c = 0; c < 7; c++) {
          const d = weekDates[c];
          const curISO = formatISODate(d);
          const isToday = (curISO === todayISO);
          
          let cellClasses = [slotClass];
          if (isToday) {
            cellClasses.push('today-col');
            if (r === timeSlots.length - 1) cellClasses.push('today-bottom');
          }
          if (isThickBottom) {
            cellClasses.push('border-thick-bottom');
          }

          const matched = allCourses.filter(item => {
            if (item.stdDate !== curISO) return false;
            return item.slotHour === slotHour;
          });

          let cardsHtml = '';
          matched.forEach((m, cardIdx) => {
            const sTime = cleanTimeStr(m.start);
            const eTime = cleanTimeStr(m.end);
            const timeStr = eTime ? `${sTime}-${eTime}` : sTime;

            const cleanTeacherName = (m.teacher || '').replace(/\s*\(代課\)/g, '').trim();
            const isHighlight = cleanTeacherName.replace(/\s+/g, '').toUpperCase() === HIGHLIGHT_TEACHER.replace(/\s+/g, '').toUpperCase();

            const parityClass = (cardIdx % 2 === 0) ? 'card-odd' : 'card-even';
            let cardClasses = `course-card ${parityClass}`;
            let inlineStyle = "";
            let teacherTextStyle = "";
            let extraNameHtml = "";

            if (isHighlight) {
              cardClasses = "course-card highlight-card";
              const cName = m.className || "BODYCOMBAT®";
              extraNameHtml = `<div class="class-name-tag">(${cName})</div>`;
            } else {
              const tColor = getTeacherColor(m.teacher);
              inlineStyle = `border-left-color: ${tColor};`;
              teacherTextStyle = `color: ${tColor};`;
            }

            cardsHtml += `
              <div class="${cardClasses}" style="${inlineStyle}">
                <div class="card-row-top">
                  <span class="branch-badge">${m.branch || ''}</span>,
                  <span class="teacher-name" style="${teacherTextStyle}">${m.teacher || ''}</span>
                </div>
                <div class="card-row-time">
                  ${timeStr}
                </div>
                ${extraNameHtml}
              </div>`;
          });

          tbodyHtml += `<td class="${cellClasses.join(' ')}">${cardsHtml}</td>`;
        }

        tbodyHtml += `<td class="time-col ${slotClass} ${thickClass}">${timeLabel}</td></tr>`;
      }
      document.getElementById('tbody-rows').innerHTML = tbodyHtml;
    }

    function shiftWeek(offset) {
      currentMonday.setDate(currentMonday.getDate() + (offset * 7));
      renderTable();
    }

    // 使用標準 Web Fetch 向 Google Apps Script 取回課表 JSON
    fetch(GAS_API_URL)
      .then(res => {
        if (!res.ok) throw new Error("網路連線狀態異常：" + res.status);
        return res.json();
      })
      .then(res => {
        const rawList = (res && res.data) ? res.data : [];
        if (rawList.length === 0) {
          document.getElementById('tbody-rows').innerHTML = `<tr><td colspan="9" style="padding: 30px; text-align:center; color:#666;">試算表內查無任何課程資料。</td></tr>`;
          return;
        }

        allCourses = rawList.map(item => {
          return {
            ...item,
            stdDate: toStandardDateStr(item.date),
            slotHour: parseHour(item.start)
          };
        }).filter(c => c.stdDate && c.slotHour >= 0);

        const todayISO = formatISODate(new Date());
        const allStdDates = allCourses.map(c => c.stdDate).sort();
        
        let targetDateStr = allStdDates.find(d => d >= todayISO) || allStdDates[0];
        if (targetDateStr) {
          const parts = targetDateStr.split('-');
          const targetDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          currentMonday = getMonday(targetDate);
        }

        initTeacherColors(allCourses);
        renderTable();
      })
      .catch(err => {
        document.getElementById('tbody-rows').innerHTML = `<tr><td colspan="9" style="color:red; padding:20px;">資料載入失敗: ${err.message}</td></tr>`;
      });
  </script>
</body>
</html>
